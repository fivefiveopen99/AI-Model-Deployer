services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ~/.kube:/root/.kube:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/models.db
      - REDIS_URL=redis://redis:6379/0
      - LOCAL_IMAGE_PATH=${LOCAL_IMAGE_PATH:-./data/images}
      - K8S_CONFIG_PATH=${K8S_CONFIG_PATH:-}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-default}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - K8S_SSH_USER=${K8S_SSH_USER:-root}
      - HTTP_PROXY=${BACKEND_HTTP_PROXY:-}
      - HTTPS_PROXY=${BACKEND_HTTPS_PROXY:-}
      - ALL_PROXY=${BACKEND_ALL_PROXY:-}
      - NO_PROXY=${BACKEND_NO_PROXY:-localhost,127.0.0.1,redis,backend,frontend,host.docker.internal,10.10.25.69}
      - http_proxy=${BACKEND_HTTP_PROXY:-}
      - https_proxy=${BACKEND_HTTPS_PROXY:-}
      - all_proxy=${BACKEND_ALL_PROXY:-}
      - no_proxy=${BACKEND_NO_PROXY:-localhost,127.0.0.1,redis,backend,frontend,host.docker.internal,10.10.25.69}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - ai-model-deployer

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ai-model-deployer

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-model-deployer

volumes:
  redis_data:

networks:
  ai-model-deployer:
    driver: bridge
